<html lang="en">
<head>

<!-- Structured data: tells Google the site's name and which logo is yours -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://dist.co.nz/#website",
      "name": "dist studio",
      "alternateName": "dist",
      "url": "https://dist.co.nz/",
      "publisher": { "@id": "https://dist.co.nz/#organization" }
    },
    {
      "@type": "Organization",
      "@id": "https://dist.co.nz/#organization",

        "@type": "ImageObject",
        "url": "https://dist.co.nz/logo.png",

}

<link rel="icon" type="image/png" sizes="512x512" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 72'%3E%3Cpolygon points='0,0 0,72 28,44 28,0' fill='%238da2d4'/%3E%3Cpolygon points='28,0 28,44 72,0' fill='%233a20c9'/%3E%3Cpolygon points='28,44 28,72 100,0 72,0' fill='%235b00e8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0b0a12;
    display: grid;
    place-items: center;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* Soft violet/indigo glow, same as the movie app. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(900px 500px at 0% -10%, #5b00e82a, transparent 70%),
      radial-gradient(700px 420px at 100% 0%, #3a20c91f, transparent 70%);
  }

  /* Logo lockup. Everything is in em so it scales as one piece:
     the mark is 1.125em tall, the letters sit centred within its height, 0.0625em gap. */
  .brand {
    position: relative;
    display: flex;
    align-items: baseline;          /* "dist" baseline starts on the mark's bottom edge... */
    gap: .0625em;
    font-size: clamp(56px, 12vw, 120px);
  }
  .brand svg {
    width: 1.5625em;
    height: 1.125em;
    display: block;
    flex-shrink: 0;
    filter: drop-shadow(0 .12em .45em #5b00e866);
  }
  .brand span {
    position: relative;
    top: -.18em;                    /* ...then lifts so the letters are centred in the mark */
    font-weight: 800;
    letter-spacing: -.045em;
    line-height: 1;
    color: #7476ff;
  }
  /* Small, quiet link to the dashboard (app.dist.co.nz), top-right. */
  .signin {
    position: fixed;
    top: 18px;
    right: 22px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid #29253d;
    background: #15131f99;
    color: #9c99b5;
    font: 500 13px/1 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    text-decoration: none;
    transition: color .15s, border-color .15s, background .15s;
  }
  .signin:hover { color: #ecebf5; border-color: #3a3555; background: #1c1a2b; }
  .signin:focus-visible { outline: 2px solid #8b74ff; outline-offset: 2px; }
</style>
</head>
<body>
  <a class="signin" href="https://app.dist.co.nz/login">Sign in</a>
  <h1 class="brand" aria-label="dist studio" style="margin:0">
    <svg viewBox="0 0 100 72" aria-hidden="true">
      <polygon points="0,0 0,72 28,44 28,0" fill="#8da2d4"/>
      <polygon points="28,0 28,44 72,0" fill="#3a20c9"/>
      <polygon points="28,44 28,72 100,0 72,0" fill="#5b00e8"/>
    </svg>
    <span aria-hidden="true">dist</span>
  </h1>
  <!-- Visitor counter (app.dist.co.nz/api/hit): no cookies; sends only the page and the referring site's name. -->
  <script>new Image().src="https://app.dist.co.nz/api/hit?p="+encodeURIComponent(location.pathname)+"&r="+encodeURIComponent(document.referrer.split("/")[2]||"")</script>
  <noscript><img src="https://app.dist.co.nz/api/hit?p=/" alt="" width="1" height="1" style="position:absolute;left:-9999px"></noscript>
</body>
</html>
